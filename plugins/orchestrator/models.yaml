    strengths: "Latest workhorse coding model. DeepSWE 1.1 at 75.0% (vendor), close to Astra at about 1/5 the price."
    weaknesses: "ultra effort self-delegates (never auto)."
    suitability: {implement: 5, refactor: 4, debug: 4, test: 4, review: 4, plan: 4, spec: 4, research: 4, mechanical: 4}
